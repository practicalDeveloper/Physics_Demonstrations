<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forces addtion</title>
    <link type="text/css" rel="Stylesheet" href="../../css/variables.css" />
    <link type="text/css" rel="Stylesheet" href="../../css/controls.css" />
</head>

<body>


    <div class="content">
        <div class="contentTitle" data-resource="Appliances.SpringDynam"> </div>
    </div>

    <!-- Макс. значение пружинного динамометра -->
    <div class="content">
        <div class="contentTitle">
            <span data-resource="ArchimedesPrinciple.MaxValue"></span>
        </div>
        <div class="content">
            <!--  Слайдер диапазона макс. значения пружинного динамометра -->
            <input type="range" min="5" max="1000" value="600" step="1" class="slider" id="maxValueSpring">
            <!-- Value label-->
            <div class="text"> </div>
        </div>
    </div>


    <div class="content">
        <div class="contentTitle">
            <button id="setSpringValueButton" class="button" data-resource="Appliances.SetValue"></button>
        </div>
        
        <input id="springValueTextBox" data-no-pass-input size="5" type="text" value="0" />  
    </div>



    <div style="height: 30px;">
    </div>


    <div class="content">
        <div class="contentTitle" data-resource="Appliances.ArrowDynam"> </div>
    </div>

    <!-- Макс. значение стрелочного динамометра -->
    <div class="content">
        <div class="contentTitle">
            <span data-resource="ArchimedesPrinciple.MaxValue"></span>
        </div>
        <div class="content">
            <!--  Слайдер диапазона макс. значения стрелочного динамометра -->
            <input type="range" min="2" max="50" value="12" step="1" class="slider" id="maxValueArrow">
            <!-- Value label-->
            <div class="text"> </div>
        </div>
    </div>


    <div class="content">
        <div class="contentTitle">
            <button id="setArrowValueButton" class="button" data-resource="Appliances.SetValue"></button>
        </div>
        <input id="arrowValueTextBox" data-no-pass-input size="5" type="text" value="0" />  
    </div>


    <script type="module" src="../js/appliancesFrame.js"> </script>

</body>

</html>
