<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archimede's principle</title>
    <link type="text/css" rel="Stylesheet" href="../../css/variables.css" />
    <link rel="stylesheet" href="../../css/controls.css">
</head>

<body>

    <!-- Длина маятника, input -->
    <div class="content">
        <div class="contentTitle">
            <span data-resource="Pendulum.Length"></span>
            (<span data-resource="Units.Meter"></span>):
        </div>

        <div class="content">
            <!-- Длина, слайдер -->
            <input type="range" min="1" max="10" value="3" step="0.1" class="slider" id="lengthRange">
            <!-- Значение, label-->
            <div class="text"> </div>
        </div>
    </div>

    <!-- Начальный угол маятника -->
    <div class="content">
         <div class="contentTitle">
            <span data-resource="Pendulum.StartAngle"></span>
            (<span data-resource="Units.Degr"></span>):
        </div>

        <div class="content">
            <!-- Угол, слайдер -->
            <input type="range" min="0" max="360" value="30" step="1" class="slider" id="angleRange">
            <!-- Значение, label-->
            <div class="text"> </div>
        </div>
    </div>

    <!-- Длина маятника -->
    <div class="content">
        <div class="contentTitle">
            <span data-resource="Pendulum.SecondLength"></span>
            (<span data-resource="Units.Meter"></span>):
        </div>

        <div class="content">
            <!-- Длина, слайдер -->
            <input type="range" min="1" max="10" value="7" step="0.1" class="slider" id="lengthRangeSecond">
            <!-- Значение, label-->
            <div class="text"> </div>
        </div>
    </div>


    <!-- Начальный угол маятника -->
    <div class="content">
         <div class="contentTitle">
            <span data-resource="Pendulum.SecondStartAngle"></span>
            (<span data-resource="Units.Degr"></span>):
        </div>

        <div class="content">
            <!-- Угол, слайдер -->
            <input type="range" min="0" max="360" value="45" step="1" class="slider" id="angleRangeSecond">
            <!-- Значение, label-->
            <div class="text"> </div>
        </div>
    </div>


    <br>
    <!-- Уравнение периода первого маятника -->
    <div class="content">
        <span>T<sub>1</sub> = 2 * &pi; * &radic;<span style="text-decoration:overline;"> l / g </span> = <span
                id="firstPeriodLabel"> 0 </span> (<span data-resource="Units.Sec"></span>)
        </span>
    </div>

    <!-- Уравнение частоты первого маятника -->
    <div class="content">
        <span>V<sub>1</sub> = 1/ T<sub>1</sub> = <span id="firstFrequencyLabel"> 0 </span> (<span data-resource="Units.Hz"></span>)
        </span>
    </div>

    <!-- Уравнение периода второго маятника -->
    <div class="content">
        <span>T<sub>2</sub> = 2 * &pi; * &radic;<span style="text-decoration:overline;"> l / g </span> = <span
                id="secondPeriodLabel"> 0 </span> (<span data-resource="Units.Sec"></span>)
        </span>
    </div>

    <!-- Уравнение частоты второго маятника -->
    <div class="content">
        <span>V<sub>2</sub> = 1/ T<sub>2</sub> = <span id="secondFrequencyLabel"> 0 </span> (<span data-resource="Units.Hz"></span>)
        </span>
    </div>

    <br>

    <!-- Условие -->
    <div class="content">
        <span id="conditionLabel"> </span>
    </div>


    <br>

<script type="module" src="../js/pendulumFrame.js"> </script>

</body>

</html>
